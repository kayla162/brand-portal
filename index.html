<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==========================================================
         SEO ── 這一段是給搜尋引擎 / 社群分享看的，改品牌名稱時請一起改
         ========================================================== -->
    <title>XXX｜官方品牌入口</title>
    <meta name="description" content="探索 XXX 的精選商品、品牌資訊與旅宿服務。" />
    <link rel="canonical" href="https://example.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FBF9F6" />

    <!-- Open Graph（Facebook / LINE 分享預覽） -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:site_name" content="XXX" />
    <meta property="og:title" content="XXX｜官方品牌入口" />
    <meta property="og:description" content="探索 XXX 的精選商品、品牌資訊與旅宿服務。" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/images/hero.jpg" />
    <meta property="og:image:width" content="2000" />
    <meta property="og:image:height" content="1125" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XXX｜官方品牌入口" />
    <meta name="twitter:description" content="探索 XXX 的精選商品、品牌資訊與旅宿服務。" />
    <meta name="twitter:image" content="https://example.com/images/hero.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 字型：Noto Serif TC（標題）+ Noto Sans TC（內文） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- 結構化資料（Google 認識你的品牌） -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "XXX",
        "url": "https://example.com/",
        "logo": "https://example.com/apple-touch-icon.png",
        "description": "探索 XXX 的精選商品、品牌資訊與旅宿服務。"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
