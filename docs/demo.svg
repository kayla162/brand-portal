<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="使用流程動畫：感應 NFC → 品牌總入口 → 度假小屋體驗中心">
  <style>
    text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .serif { font-family: "Noto Serif TC", "Songti TC", "PingFang TC", serif; }
    .s1 { animation: s1 12s infinite; }
    .s2 { animation: s2 12s infinite; opacity: 0; }
    .s3 { animation: s3 12s infinite; opacity: 0; }
    .d1 { animation: d1 12s infinite; }
    .d2 { animation: d2 12s infinite; }
    .d3 { animation: d3 12s infinite; }
    .wave { animation: wave 1.4s ease-out infinite; transform-origin: 360px 190px; }
    .wave.b { animation-delay: .45s; }
    .card { animation: rise 12s infinite; opacity: 0; }
    .card.c2 { animation-name: rise2; }
    .card.c3 { animation-name: rise3; }
    .tap { animation: tap 12s infinite; opacity: 0; }

    @keyframes s1 { 0%,28% { opacity: 1 } 33%,95% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes s2 { 0%,30% { opacity: 0 } 35%,61% { opacity: 1 } 66%,100% { opacity: 0 } }
    @keyframes s3 { 0%,63% { opacity: 0 } 68%,95% { opacity: 1 } 100% { opacity: 0 } }

    @keyframes d1 { 0%,30% { fill: #1e3b33 } 33%,100% { fill: #e8e3da } }
    @keyframes d2 { 0%,30% { fill: #e8e3da } 33%,63% { fill: #1e3b33 } 66%,100% { fill: #e8e3da } }
    @keyframes d3 { 0%,63% { fill: #e8e3da } 66%,96% { fill: #1e3b33 } 100% { fill: #e8e3da } }

    @keyframes wave { from { transform: scale(.6); opacity: .9 } to { transform: scale(1.5); opacity: 0 } }

    @keyframes rise  { 0%,34% { opacity: 0; transform: translateY(14px) } 39%,62% { opacity: 1; transform: none } 66%,100% { opacity: 0 } }
    @keyframes rise2 { 0%,37% { opacity: 0; transform: translateY(14px) } 42%,62% { opacity: 1; transform: none } 66%,100% { opacity: 0 } }
    @keyframes rise3 { 0%,40% { opacity: 0; transform: translateY(14px) } 45%,62% { opacity: 1; transform: none } 66%,100% { opacity: 0 } }
    @keyframes tap   { 0%,52% { opacity: 0 } 55%,60% { opacity: .55 } 63%,100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .wave, .card, .tap { animation: none; }
    }
  </style>

  <rect width="720" height="420" rx="18" fill="#fbf9f6"/>

  <!-- 手機外框 -->
  <rect x="270" y="24" width="180" height="330" rx="26" fill="#1a1c1b"/>
  <rect x="279" y="33" width="162" height="312" rx="19" fill="#ffffff"/>
  <rect x="335" y="40" width="50" height="7" rx="3.5" fill="#1a1c1b"/>

  <!-- 場景 1：感應 NFC -->
  <g class="s1">
    <circle class="wave" cx="360" cy="190" r="40" fill="none" stroke="#a9834e" stroke-width="3"/>
    <circle class="wave b" cx="360" cy="190" r="40" fill="none" stroke="#a9834e" stroke-width="3"/>
    <circle cx="360" cy="190" r="28" fill="#1e3b33"/>
    <text x="360" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#fbf9f6">NFC</text>
    <text x="360" y="268" text-anchor="middle" font-size="14" fill="#1a1c1b">輕觸手機</text>
    <text x="360" y="288" text-anchor="middle" font-size="11" fill="#6b6f6c">一秒進入品牌總入口</text>
  </g>

  <!-- 場景 2：首頁三張品牌卡 -->
  <g class="s2">
    <rect x="279" y="52" width="162" height="62" fill="#1e3b33"/>
    <text class="serif" x="360" y="82" text-anchor="middle" font-size="16" fill="#fbf9f6">和顏悦舍</text>
    <text x="360" y="100" text-anchor="middle" font-size="8" letter-spacing="1.5" fill="#a9834e">HE-YAN GLAMPING SITE</text>

    <g class="card">
      <rect x="291" y="126" width="138" height="62" rx="10" fill="#fbf9f6" stroke="#e8e3da"/>
      <rect x="299" y="134" width="46" height="46" rx="7" fill="#2c544a"/>
      <text x="355" y="153" font-size="11" font-weight="700" fill="#1a1c1b">度假小屋</text>
      <text x="355" y="169" font-size="8.5" fill="#6b6f6c">台東長濱</text>
    </g>
    <g class="card c2">
      <rect x="291" y="196" width="138" height="62" rx="10" fill="#fbf9f6" stroke="#e8e3da"/>
      <rect x="299" y="204" width="46" height="46" rx="7" fill="#a9834e"/>
      <text x="355" y="223" font-size="11" font-weight="700" fill="#1a1c1b">美妝保養</text>
      <text x="355" y="239" font-size="8.5" fill="#6b6f6c">官方授權通路</text>
    </g>
    <g class="card c3">
      <rect x="291" y="266" width="138" height="62" rx="10" fill="#fbf9f6" stroke="#e8e3da"/>
      <rect x="299" y="274" width="46" height="46" rx="7" fill="#6b6f6c"/>
      <text x="355" y="293" font-size="11" font-weight="700" fill="#1a1c1b">女裝服飾</text>
      <text x="355" y="309" font-size="8.5" fill="#6b6f6c">生活選物</text>
    </g>
    <circle class="tap" cx="322" cy="157" r="16" fill="#a9834e"/>
  </g>

  <!-- 場景 3：度假小屋體驗中心 -->
  <g class="s3">
    <rect x="279" y="52" width="162" height="70" fill="#2c544a"/>
    <text class="serif" x="360" y="84" text-anchor="middle" font-size="14" fill="#fbf9f6">度假小屋</text>
    <rect x="325" y="96" width="70" height="18" rx="9" fill="#a9834e"/>
    <text x="360" y="109" text-anchor="middle" font-size="9" fill="#ffffff">立即訂房</text>

    <text x="291" y="142" font-size="10" font-weight="700" fill="#1a1c1b">空房查詢</text>
    <g fill="#e8e3da">
      <rect x="291" y="150" width="16" height="14" rx="3"/><rect x="311" y="150" width="16" height="14" rx="3" fill="#1e3b33"/>
      <rect x="331" y="150" width="16" height="14" rx="3"/><rect x="351" y="150" width="16" height="14" rx="3"/>
      <rect x="371" y="150" width="16" height="14" rx="3" fill="#1e3b33"/><rect x="391" y="150" width="16" height="14" rx="3" fill="#1e3b33"/>
      <rect x="411" y="150" width="16" height="14" rx="3"/>
      <rect x="291" y="168" width="16" height="14" rx="3"/><rect x="311" y="168" width="16" height="14" rx="3"/>
      <rect x="331" y="168" width="16" height="14" rx="3" fill="#1e3b33"/><rect x="351" y="168" width="16" height="14" rx="3"/>
      <rect x="371" y="168" width="16" height="14" rx="3"/><rect x="391" y="168" width="16" height="14" rx="3"/>
      <rect x="411" y="168" width="16" height="14" rx="3" fill="#1e3b33"/>
    </g>

    <text x="291" y="206" font-size="10" font-weight="700" fill="#1a1c1b">在地體驗</text>
    <g font-size="9" fill="#1a1c1b" text-anchor="middle">
      <rect x="291" y="214" width="66" height="44" rx="8" fill="#fbf9f6" stroke="#e8e3da"/><text x="324" y="240">🍜 美食地圖</text>
      <rect x="363" y="214" width="66" height="44" rx="8" fill="#fbf9f6" stroke="#e8e3da"/><text x="396" y="240">🏞 附近景點</text>
      <rect x="291" y="264" width="66" height="44" rx="8" fill="#fbf9f6" stroke="#e8e3da"/><text x="324" y="290">🗺 一日遊</text>
      <rect x="363" y="264" width="66" height="44" rx="8" fill="#fbf9f6" stroke="#e8e3da"/><text x="396" y="290">🎉 最新活動</text>
    </g>
  </g>

  <!-- 步驟指示 -->
  <g font-size="13" text-anchor="middle">
    <circle class="d1" cx="190" cy="388" r="6"/>
    <text x="190" y="378" dy="-10" fill="#1a1c1b">① 感應 NFC</text>
    <circle class="d2" cx="360" cy="388" r="6"/>
    <text x="360" y="378" dy="-10" fill="#1a1c1b">② 一頁看完所有品牌</text>
    <circle class="d3" cx="530" cy="388" r="6"/>
    <text x="530" y="378" dy="-10" fill="#1a1c1b">③ 度假小屋體驗中心</text>
    <line x1="200" y1="388" x2="350" y2="388" stroke="#e8e3da" stroke-width="2"/>
    <line x1="370" y1="388" x2="520" y2="388" stroke="#e8e3da" stroke-width="2"/>
  </g>
</svg>
